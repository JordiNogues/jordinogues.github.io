<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página personal">
  <title>Jordi Nogués</title>

  <style>
    :root {
      --bg: #f6f5f2;
      --text: #171717;
      --muted: #6b6b6b;
      --line: #d8d6d0;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(720px, 100%);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 650;
    }

    .intro {
      max-width: 540px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.55;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 72px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: var(--text);
    }

    @media (max-width: 560px) {
      body {
        padding: 24px;
      }

      footer {
        flex-direction: column;
        margin-top: 52px;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">Personal website</p>

    <h1>Jordi<br>Nogués</h1>

    <p class="intro">
      Welcome. This space is currently under construction.
    </p>

    <footer>
      <span>© 2026 Jordi Nogués</span>
      <a href="mailto:jordi@losnogues.com">Contact</a>
    </footer>
  </main>
</body>
</html>
